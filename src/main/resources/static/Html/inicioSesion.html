<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>CakeZone - Cake Shop Website Template</title>

    <!-- Favicon -->
    <link href="../Recursos/img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Oswald:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet"> 

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="../Recursos/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="../Css/bootstrap.min.css" rel="stylesheet">

    <!-- Link al archivo CSS separado -->
    <link href="../Css/inicio.css" rel="stylesheet">
</head>

<body>
    <!-- Topbar Start -->
    <div class="container-fluid px-0 d-none d-lg-block">
        <div class="row gx-0">
            <div class="col-lg-4 text-center bg-secondary py-3">
                <div class="d-inline-flex align-items-center justify-content-center">
                    <div class="text-start">
                    </div>
                </div>
            </div>
            <div class="col-lg-4 text-center bg-primary border-inner py-3">
                <a href="../index.html" class="d-inline-flex align-items-center justify-content-center text-decoration-none">
                    <img src="../Recursos/img/logo.png" alt="Logo" class="me-3" style="height: 50px;">
                    <h1 class="m-0 text-uppercase text-white">Cafeterías</h1>
                </a>
            </div>
            <div class="col-lg-4 text-center bg-secondary py-3">
                <div class="d-inline-flex align-items-center justify-content-center">
                    <div class="text-start">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Topbar End -->

    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark shadow-sm py-3 py-lg-0 px-3 px-lg-0">
        <a href="../index.html" class="navbar-brand d-block d-lg-none">
            <h1 class="m-0 text-uppercase text-white"><i class="fa fa-birthday-cake fs-1 text-primary me-3"></i>CakeZone</h1>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto mx-lg-auto py-0">
                <a href="../index.html" class="nav-item nav-link">Página Principal</a>
            </div>
        </div>
    </nav>
    <!-- Navbar End -->

<!-- Login Visual Start -->
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="bg-dark text-white p-5 rounded shadow-lg" style="max-width: 400px; width: 100%;">
    <h2 class="text-center text-uppercase mb-4">Iniciar Sesión</h2>

    <!-- Campo de Correo -->
    <div class="mb-4">
      <label for="usuarioInput" class="mb-2 text-white-50">Correo</label>
      <div class="input-group">
        <span class="input-group-text bg-secondary border-0 text-white-50">
          <i class="fa fa-user"></i>
        </span>
        <input type="text" id="usuarioInput" class="form-control bg-secondary text-white border-0" placeholder="Escribe tu correo..." />
      </div>
    </div>

    <!-- Campo de Contraseña -->
    <div class="mb-4">
      <label for="passwordInput" class="mb-2 text-white-50">Contraseña</label>
      <div class="input-group">
        <span class="input-group-text bg-secondary border-0 text-white-50">
          <i class="fa fa-lock"></i>
        </span>
        <input type="password" id="passwordInput" class="form-control bg-secondary text-white border-0" placeholder="********" />
      </div>
    </div>

    <!-- Botón de Ingreso -->
    <div class="d-grid">
      <button id="loginBtn" class="btn btn-primary text-uppercase fw-bold">Entrar</button>
    </div>
  </div>
</div>
<!-- Login Visual End -->



    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Recursos/lib/easing/easing.min.js"></script>
    <script src="../Recursos/lib/waypoints/waypoints.min.js"></script>
    <script src="../Recursos/lib/counterup/counterup.min.js"></script>
    <script src="../Recursos/lib/owlcarousel/owl.carousel.min.js"></script>

    <!-- Template Javascript -->
    <script src="../Js/inicioSesion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
